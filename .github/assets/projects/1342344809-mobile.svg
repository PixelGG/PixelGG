<title id="title">Synex_Framework</title>
<desc id="desc">⚡ Synex — A modern, modular &amp; extensible FiveM framework built for performance, scalability and clean development. Powered by a robust core and a growing ecosystem of official resources — from characters, inventory &amp; banking to phones, radio, vehicles, jobs and beyond. Lua. Letzter Push 31.08.2026. Repository öffnen.</desc>
