<title id="title">DXForge</title>
<desc id="desc">DXForge is a DX9 Lua UI library focused on building customizable in-game overlay interfaces with draggable windows, tabs, groupboxes, buttons, toggles, sliders, keybinds, color pickers, notifications, tooltips, themes, and reusable UI components. Lua. Letzter Push 02.07.2026. Repository öffnen.</desc>
