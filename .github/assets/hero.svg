<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Mike PixelGG — systems engineering</title>
  <desc id="desc">Animated control-plane visual showing a request passing through a guarded gateway into auditable server domains.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050D17"/>
      <stop offset=".52" stop-color="#091827"/>
      <stop offset="1" stop-color="#06111E"/>
    </linearGradient>
    <linearGradient id="route" x1="730" y1="0" x2="1328" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset=".48" stop-color="#D8B36A"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1038 286) rotate(90) scale(260 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8B36A" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#2DD4BF" stop-opacity=".035"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#8BA7BC" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1400" height="560" rx="28"/></clipPath>
    <style>
      .sans{font-family:"Segoe UI",Arial,sans-serif}
      .mono{font-family:Consolas,"Courier New",monospace}
      .packet{filter:url(#glow)}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .scan{animation:scan 7s linear infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes scan{0%{transform:translateX(-260px)}100%{transform:translateX(1660px)}}
      @media (prefers-reduced-motion:reduce){.motion,.scan{display:none}.pulse{animation:none;opacity:.75}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="560" fill="url(#bg)"/>
    <rect width="1400" height="560" fill="url(#grid)"/>
    <rect width="1400" height="560" fill="url(#halo)"/>
    <path d="M-60 472C210 364 420 504 698 432c250-65 421-16 762-121v249H-60Z" fill="#2DD4BF" opacity=".018"/>
    <rect class="scan" x="-260" width="180" height="560" fill="#D8B36A" opacity=".025" transform="skewX(-16)"/>

    <g transform="translate(72 62)">
      <circle cx="4" cy="4" r="4" fill="#2DD4BF" class="pulse"/>
      <text x="20" y="9" class="mono" fill="#8FA8BB" font-size="13" font-weight="700" letter-spacing="2.5">PIXELGG / SYSTEMS ENGINEERING</text>
    </g>
    <text x="1328" y="71" text-anchor="end" class="mono" fill="#5F788C" font-size="12" letter-spacing="2">CONTROL PLANE · ONLINE</text>

    <g transform="translate(72 150)">
      <text class="sans" fill="#F1F5F8" font-size="88" font-weight="800" letter-spacing="-4">MIKE</text>
      <text x="0" y="85" class="sans" fill="#D8B36A" font-size="88" font-weight="300" letter-spacing="-4">/ PIXELGG</text>
      <text x="4" y="143" class="sans" fill="#B5C5D1" font-size="22" font-weight="500" letter-spacing=".5">Ich entwickle Systeme, die unter Druck erklärbar bleiben.</text>
      <path d="M4 177H540" stroke="#284357"/>
      <text x="4" y="210" class="mono" fill="#7891A4" font-size="13" letter-spacing="1.65">GAME SYSTEMS · BACKEND · AUTOMATION · OPERATIONS</text>
    </g>

    <g transform="translate(716 128)">
      <text x="0" y="-20" class="mono" fill="#7891A4" font-size="12" letter-spacing="2">REQUEST PATH / GUARDED</text>

      <path id="requestPath" d="M0 158H132L174 116H318L364 158H612" fill="none" stroke="#1D394C" stroke-width="12" stroke-linecap="round"/>
      <path d="M0 158H132L174 116H318L364 158H612" fill="none" stroke="url(#route)" stroke-width="2" stroke-linecap="round"/>

      <g class="motion">
        <circle r="5" fill="#E8FFFB" class="packet">
          <animateMotion dur="5.4s" repeatCount="indefinite" rotate="auto">
            <mpath href="#requestPath"/>
          </animateMotion>
        </circle>
        <circle r="3.5" fill="#2DD4BF" opacity=".9">
          <animateMotion dur="5.4s" begin="-2.7s" repeatCount="indefinite" rotate="auto">
            <mpath href="#requestPath"/>
          </animateMotion>
        </circle>
      </g>

      <g transform="translate(235 44)">
        <path d="M34 0h62l34 34v161l-34 34H34L0 195V34Z" fill="#0B1825" stroke="#D8B36A" stroke-width="1.5"/>
        <path d="M18 52H112M18 177H112" stroke="#5D4726"/>
        <circle cx="65" cy="0" r="5" fill="#D8B36A" class="pulse" filter="url(#glow)"/>
        <text x="65" y="34" text-anchor="middle" class="mono" fill="#E6C986" font-size="11" font-weight="700" letter-spacing="1.5">TRUST GATE</text>
        <g class="mono" font-size="10" letter-spacing=".8">
          <rect x="19" y="70" width="92" height="25" rx="4" fill="#132536" stroke="#315066"/>
          <text x="65" y="87" text-anchor="middle" fill="#C5D5DF">SESSION</text>
          <rect x="19" y="104" width="92" height="25" rx="4" fill="#132536" stroke="#315066"/>
          <text x="65" y="121" text-anchor="middle" fill="#C5D5DF">SCHEMA</text>
          <rect x="19" y="138" width="92" height="25" rx="4" fill="#1A2834" stroke="#7C6234"/>
          <text x="65" y="155" text-anchor="middle" fill="#E6C986">POLICY</text>
        </g>
        <text x="65" y="208" text-anchor="middle" class="mono" fill="#6F8799" font-size="9" letter-spacing="1">DEFAULT DENY</text>
      </g>

      <g class="sans">
        <rect x="0" y="238" width="174" height="92" rx="12" fill="#0A1B2A" stroke="#254358"/>
        <circle cx="24" cy="263" r="5" fill="#2DD4BF"/>
        <text x="40" y="269" fill="#DCE7ED" font-size="14" font-weight="700" letter-spacing=".8">CLIENT INTENT</text>
        <text x="20" y="298" fill="#70899C" font-size="12">request · context</text>
        <text x="20" y="316" fill="#70899C" font-size="12">never authority</text>

        <rect x="194" y="238" width="200" height="92" rx="12" fill="#0A1B2A" stroke="#705A33"/>
        <circle cx="218" cy="263" r="5" fill="#D8B36A"/>
        <text x="234" y="269" fill="#E8D5A8" font-size="14" font-weight="700" letter-spacing=".8">DOMAIN COMMIT</text>
        <text x="214" y="298" fill="#70899C" font-size="12">validate · decide</text>
        <text x="214" y="316" fill="#70899C" font-size="12">persist atomically</text>

        <rect x="414" y="238" width="198" height="92" rx="12" fill="#0A1B2A" stroke="#254358"/>
        <circle cx="438" cy="263" r="5" fill="#2DD4BF"/>
        <text x="454" y="269" fill="#DCE7ED" font-size="14" font-weight="700" letter-spacing=".8">PROOF</text>
        <text x="434" y="298" fill="#70899C" font-size="12">audit · outbox</text>
        <text x="434" y="316" fill="#70899C" font-size="12">health · recovery</text>
      </g>
    </g>

    <g class="mono" font-size="10" letter-spacing="1.4" fill="#526C80">
      <text x="72" y="520">CLIENTS REQUEST</text>
      <text x="700" y="520" text-anchor="middle" fill="#9A7B43">SERVERS DECIDE</text>
      <text x="1328" y="520" text-anchor="end">OPERATIONS PROVE</text>
    </g>
    <path d="M198 516H654M746 516H1198" stroke="#203A4D"/>
  </g>
  <rect x=".75" y=".75" width="1398.5" height="558.5" rx="27.25" fill="none" stroke="#2A4356" stroke-width="1.5"/>
</svg>
