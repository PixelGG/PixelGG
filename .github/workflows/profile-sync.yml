name: Sync profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-data
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'PixelGG/PixelGG' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # This trusted writer needs credentials for its final ordinary push.
          # Checkout removes them in its post-job cleanup.
          persist-credentials: true

      - name: Set up image export runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned image encoder
        run: npm ci --prefix .github/profile --ignore-scripts --no-audit --no-fund

      - name: Fetch complete public repository snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_profile.py

      - name: Render profile from snapshot
        run: python3 .github/scripts/render_profile.py

      - name: Export original artwork as looping GIFs
        run: node .github/scripts/render_motion.cjs

      - name: Test snapshot synchronization
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Verify generated profile
        run: python3 .github/scripts/render_profile.py --check

      - name: Validate local images and SVGs
        run: python3 .github/scripts/check_profile.py

      - name: Verify looping GIF exports and source fingerprints
        run: node .github/scripts/render_motion.cjs --check

      - name: Commit validated changes
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md web/index.html .github/profile/public-repos.json .github/assets
          if git diff --cached --quiet; then
            echo "Public repository data is unchanged."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): sync public repository snapshot"
          git push origin "HEAD:$PROFILE_BRANCH"
